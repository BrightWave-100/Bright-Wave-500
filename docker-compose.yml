version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brightwave_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-brightwave-enterprise-prod-jwt-secret-key-2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-brightwave-enterprise-prod-refresh-secret-key-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - brightwave_data:/app/data
    networks:
      - brightwave_net
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: brightwave_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - brightwave_net

volumes:
  brightwave_data:
    driver: local

networks:
  brightwave_net:
    driver: bridge
